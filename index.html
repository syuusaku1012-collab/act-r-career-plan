<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACT-R キャリアプラン｜画像ダウンロード</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#f5f5f7;color:#1d1d1f;font-family:"Hiragino Sans","Yu Gothic","Meiryo",sans-serif;line-height:1.6}
  body{padding:24px 16px 60px}
  .wrap{max-width:720px;margin:0 auto}
  header{text-align:center;margin-bottom:28px}
  header .eyebrow{color:#c8102e;letter-spacing:.3em;font-size:11px;font-weight:700;margin-bottom:6px}
  header h1{font-size:22px;letter-spacing:.05em;margin-bottom:8px}
  header p{color:#666;font-size:13px}
  .hint{background:#fff8ec;border:1px solid #f0d28a;border-radius:10px;padding:14px 16px;color:#7a5a00;font-size:12.5px;margin-bottom:24px;line-height:1.7}
  .hint b{color:#c8102e}
  .card{background:#fff;border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.06);padding:18px;margin-bottom:18px}
  .card h2{font-size:16px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card h2 .num{background:#c8102e;color:#fff;font-size:11px;padding:3px 9px;border-radius:4px;font-weight:700;letter-spacing:.05em}
  .preview{border-radius:8px;overflow:hidden;background:#fafafa;border:1px solid #eee;margin-bottom:14px}
  .preview img{display:block;width:100%;height:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{flex:1;min-width:140px;display:inline-flex;justify-content:center;align-items:center;gap:6px;padding:13px 16px;border-radius:8px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;text-align:center;transition:transform .05s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:#c8102e;color:#fff}
  .btn-secondary{background:#eee;color:#333}
  .card.full{border:2px solid #c8102e}
  .card.full h2 .num{background:#1d1d1f}
  footer{text-align:center;color:#999;font-size:11px;margin-top:30px}
  @media(max-width:520px){
    header h1{font-size:18px}
    .card h2{font-size:14px}
    .btn{font-size:13px;padding:12px 12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">C A R E E R &nbsp; P L A N</div>
    <h1>ACT-R キャリアプラン</h1>
    <p>画像ダウンロード ページ</p>
  </header>

  <div class="hint">
    📥 各セクションを <b>画像として保存</b> できます。<br>
    ボタンを押すと端末の「ダウンロード」または「写真」に保存されます。<br>
    <span style="display:inline-block;margin-top:6px">スマホの場合は、画像を<b>長押し</b>して「写真に保存」もできます。</span>
  </div>

  <div class="card">
    <h2><span class="num">01</span>入社前 ─ 4つのミーティング</h2>
    <div class="preview"><img src="section1_meetings.png" alt="入社前 4つのミーティング" loading="lazy"></div>
    <div class="row">
      <a class="btn btn-primary" href="section1_meetings.png" download="01_入社前ミーティング.png">📥 画像を保存</a>
      <a class="btn btn-secondary" href="section1_meetings.png" target="_blank" rel="noopener">🔍 拡大表示</a>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">02</span>入社後 ─ 4ステップでキャリアアップ</h2>
    <div class="preview"><img src="section2_steps.png" alt="入社後 4ステップ" loading="lazy"></div>
    <div class="row">
      <a class="btn btn-primary" href="section2_steps.png" download="02_入社後4ステップ.png">📥 画像を保存</a>
      <a class="btn btn-secondary" href="section2_steps.png" target="_blank" rel="noopener">🔍 拡大表示</a>
    </div>
  </div>

  <div class="card">
    <h2><span class="num">03</span>2つのキャリアルート</h2>
    <div class="preview"><img src="section3_routes.png" alt="2つのキャリアルート" loading="lazy"></div>
    <div class="row">
      <a class="btn btn-primary" href="section3_routes.png" download="03_キャリアルート.png">📥 画像を保存</a>
      <a class="btn btn-secondary" href="section3_routes.png" target="_blank" rel="noopener">🔍 拡大表示</a>
    </div>
  </div>

  <div class="card full">
    <h2><span class="num">ALL</span>全体（1枚にまとめたもの）</h2>
    <div class="preview"><img src="career_plan.png" alt="ACT-R キャリアプラン 全体" loading="lazy"></div>
    <div class="row">
      <a class="btn btn-primary" href="career_plan.png" download="ACT-R_キャリアプラン_全体.png">📥 画像を保存</a>
      <a class="btn btn-secondary" href="career_plan.png" target="_blank" rel="noopener">🔍 拡大表示</a>
    </div>
  </div>

  <footer>© ACT-R Career Plan</footer>

</div>
</body>
</html>
